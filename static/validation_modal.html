<!-- Modal de Validação -->
<div id="validationModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">Validar Contrato</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="modal-info">
                <strong>📁 Coleção:</strong> <span id="modalCollectionName"></span><br>
                <strong>📄 Contrato:</strong> <span id="modalContractName"></span><br>
                <strong>🔢 Versão:</strong> <span id="modalVersion">v1.0</span><br>
                <strong>🌐 Método:</strong> <span id="modalMethod">POST</span>
            </div>
            
            <div class="modal-two-columns">
                <div class="modal-left-column">
                    <div style="margin-bottom: 20px;">
                        <label for="validationBody" style="display: block; margin-bottom: 8px; font-weight: 600; color: #172b4d;">📝 Body para Validação (JSON):</label>
                        <textarea id="validationBody" class="json-input" placeholder='{
  "message": "exemplo",
  "data": {
    "id": 123,
    "status": "success"
  }
}'></textarea>
                    </div>
                    <div style="margin-bottom: 20px; display: flex; gap: 10px;">
                        <button class="btn btn-secondary" onclick="formatValidationJson()">✨ Formatar JSON</button>
                        <button class="btn btn-info js-dependent" onclick="showValidationHistory()">📋 Histórico</button>
                        <button class="btn btn-success js-dependent" onclick="showCurlModal()">🚀 Validação Automática</button>
                    </div>
                    <div id="validationResult" class="validation-result" style="display: none;"></div>
                </div>
                
                <div class="modal-right-column">
                    <div class="schema-preview-header">
                        <h4>📋 Preview do Schema</h4>
                    </div>
                    <div id="schemaPreview" class="schema-preview">
                        <div class="schema-loading">⏳ Carregando schema...</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">❌ Cancelar</button>
            <button class="btn btn-primary" onclick="executeValidation()">🚀 Executar Validação</button>
        </div>
    </div>
</div>


    <!-- Modal de Histórico será incluída via JavaScript -->
    <script src="/static/js/modals/history-modal.js"></script>
    
    <!-- Modal de Curl -->
    <div id="curlModalContainer"></div>
    <script src="/static/js/modals/curl-modal.js"></script>
    <script>
        // Carregar modal de curl
        fetch('/static/curl_modal.html')
            .then(response => response.text())
            .then(html => {
                const container = document.getElementById('curlModalContainer');
                container.innerHTML = html;
                // Adicionar classe para mostrar o container após carregar o conteúdo
                container.classList.add('loaded');
                
                // Marcar modal principal como carregada
                const modalContent = document.querySelector('.modal-content');
                if (modalContent) {
                    modalContent.classList.add('loaded');
                }
            })
            .catch(error => {
                console.error('Erro ao carregar modal de curl:', error);
                // Em caso de erro, mostrar o container vazio para evitar problemas
                document.getElementById('curlModalContainer').classList.add('loaded');
                
                // Marcar modal principal como carregada mesmo com erro
                const modalContent = document.querySelector('.modal-content');
                if (modalContent) {
                    modalContent.classList.add('loaded');
                }
            });
            
        // Garantir que a modal seja marcada como carregada quando a página estiver pronta
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                const modalContent = document.querySelector('.modal-content');
                if (modalContent && !modalContent.classList.contains('loaded')) {
                    modalContent.classList.add('loaded');
                }
            }, 100); // Pequeno delay para garantir que tudo carregou
        });
    </script>

<style>
    /* Modal */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal.show { display: block !important; }
    /* Modal de validação - tamanho padronizado v2 */
    .modal-content { background-color: #ffffff; margin: 3% auto; padding: 25px; border-radius: 8px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #ebecf0; padding-bottom: 15px; }
    .modal-title { font-size: 20px; font-weight: 600; color: #172b4d; margin: 0; }
    .close { font-size: 28px; font-weight: bold; cursor: pointer; color: #5e6c84; }
    .close:hover { color: #172b4d; }
    .modal-body { margin-bottom: 25px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #ebecf0; padding-top: 15px; }
    
    /* Layout de duas colunas */
    .modal-two-columns { display: flex; gap: 20px; min-height: 300px; }
    .modal-left-column { flex: 1; }
    .modal-right-column { flex: 1; border-left: 1px solid #ebecf0; padding-left: 20px; }
    
    /* Input JSON */
    .json-input { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13px; height: 300px; width: 100%; padding: 12px; border: 1px solid #dfe1e6; border-radius: 6px; background-color: #fafbfc; resize: vertical; }
    
    /* Resultado da validação */
    .validation-result { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .validation-success { background-color: #e3fcef; color: #006644; border: 1px solid #b7ebc6; }
    .validation-error { background-color: #ffebe6; color: #bf2600; border: 1px solid #ffbdad; }
    
    /* Info da modal */
    .modal-info { margin-bottom: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 6px; border-left: 4px solid #0065ff; }
    .modal-info strong { color: #172b4d; font-weight: 600; }
    .modal-info span { color: #5e6c84; }
    
    /* Preview do Schema */
    .schema-preview-header { margin-bottom: 15px; }
    .schema-preview-header h4 { margin: 0; color: #172b4d; font-size: 16px; font-weight: 600; }
    .schema-preview { background-color: #f8f9fa; border: 1px solid #ebecf0; border-radius: 6px; padding: 15px; height: 300px; overflow-y: auto; }
    .schema-loading { color: #5e6c84; font-style: italic; text-align: center; padding: 20px; }
    .schema-content { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; line-height: 1.4; color: #172b4d; white-space: pre-wrap; }
    .schema-error { color: #bf2600; background-color: #ffebe6; padding: 10px; border-radius: 4px; border: 1px solid #ffbdad; }

    /* Botão Info */
    .btn-info { background-color: #0065ff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-info:hover { background-color: #0052cc; }
    
    /* Botão Success */
    .btn-success { background-color: #36b37e; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-success:hover { background-color: #2d9e5e; }
    
    /* Container da Modal de Curl - oculto até carregar */
    #curlModalContainer { display: none !important; }
    #curlModalContainer.loaded { display: block !important; }
    
    /* Ocultar botões que dependem de JavaScript */
    .js-dependent { 
        opacity: 0 !important; 
        transition: opacity 0.3s ease; 
    }
    .modal-content.loaded .js-dependent { 
        opacity: 1 !important; 
    }

    /* Responsivo */
    @media (max-width: 768px) {
        .modal-content { width: 95%; margin: 5% auto; max-width: none; }
        .modal-two-columns { flex-direction: column; gap: 15px; }
        .modal-right-column { border-left: none; border-top: 1px solid #ebecf0; padding-left: 0; padding-top: 15px; }
        .json-input { min-height: 150px; }
        .schema-preview { min-height: 150px; max-height: 150px; }
    }
</style>
